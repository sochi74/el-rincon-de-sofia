<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>El Rincón de Sofía</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="title-screen">
    <h1>El Rincón de Sofía</h1>
    <p class="subtitle">Tu casita acogedora 🛋️</p>
    <button id="play-button" type="button">Jugar</button>
  </div>

  <canvas id="game" hidden></canvas>

  <button id="menu-toggle" type="button" aria-controls="selection-panel" aria-expanded="true" aria-label="Cerrar el menú" hidden>✕</button>

  <div id="selection-panel" hidden>
    <div id="clock"></div>
    <div id="coins"></div>
    <div id="selection-name"></div>
    <div id="selection-hint"></div>
    <div id="needs" hidden></div>
    <div id="friendship" hidden></div>
    <div class="panel-buttons">
      <button type="button" class="character-button" data-id="sofia">Sofía</button>
      <button type="button" class="character-button" data-id="realfixer">real.fixer</button>
      <button id="backpack-button" type="button" aria-label="Mochila">🎒</button>
      <button id="pause-button" type="button">⏸️ Pausa</button>
      <button id="reset-button" type="button">🔄 Reiniciar</button>
    </div>
  </div>

  <div id="social-menu" hidden>
    <button type="button" data-type="chat">Charlar</button>
    <button type="button" data-type="joke">Contar un chiste</button>
    <button type="button" data-type="highFive">Chocar los cinco</button>
  </div>

  <div id="seed-menu" hidden></div>

  <div id="cook-menu" hidden></div>

  <div id="backpack" hidden>
    <div class="backpack-top">
      <b>🎒 Mochila</b>
      <button id="backpack-close" type="button" aria-label="Cerrar la mochila">✕</button>
    </div>
    <div id="backpack-list"></div>
  </div>

  <div id="word-tag" hidden><b class="word-es"></b> · <i class="word-en"></i> <span class="word-say"></span></div>

  <script src="js/config.js"></script>
  <script src="js/words.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/time.js"></script>
  <script src="js/house.js"></script>
  <script src="js/city.js"></script>
  <script src="js/coins.js"></script>
  <script src="js/garden.js"></script>
  <script src="js/inventory.js"></script>
  <script src="js/gather.js"></script>
  <script src="js/cooking.js"></script>
  <script src="js/sims.js"></script>
  <script src="js/needs.js"></script>
  <script src="js/objects.js"></script>
  <script src="js/social.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/save.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
